# Release: a pushed tag X.Y.Z (bare semver) checks that CI already passed on its commit on master,
# checks the tag against the header version and the changelog, and publishes minipsd.h (include/ joined into one file by
# tools/amalgamate.cmake) + minipsd.h.sha256, and the libvips plugin as a CMake project that builds as it is
# (minipsd-vips-X.Y.Z.zip, tools/package_vips.cmake, built and run here first) + its .sha256, as a GitHub Release
# with build-provenance attestations. "Run workflow" (workflow_dispatch) does everything except publish,
# so it is a dry run. See docs/GITHUB-RELEASE.md.
name: Release

on:
  push:
    tags: [ '*.*.*' ]
  workflow_dispatch:

permissions:
  contents: write        # create the Release
  actions: read          # find CI's runs on the commit
  id-token: write        # sign the attestation
  attestations: write    # store it

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # master's history, to find the commit in it

      # CI runs on every push to master, so the commit is tested already: the release checks
      # that rather than testing it again.
      - name: Check the commit is on master and CI passed on it
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/master; then
            echo "::error::$GITHUB_SHA is not on master: a release is made from what master has"
            exit 1
          fi
          passed=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$GITHUB_SHA" \
                   --status success --json databaseId --jq length)
          if [ "$passed" -eq 0 ]; then
            echo "::error::no successful CI run on $GITHUB_SHA: wait for CI to finish, then re-run this job"
            exit 1
          fi

      - name: Check the tag, the header version and the changelog agree
        run: |
          version=$(sed -nE 's/^#define MINIPSD_VERSION_(MAJOR|MINOR|PATCH) +([0-9]+)$/\2/p' include/minipsd.h | paste -sd.)
          echo "header version: $version"
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match the header version $version"
            exit 1
          fi
          # The release notes: the changelog section of this version, without its heading.
          awk -v head="## [$version]" 'index($0, head) == 1 { on = 1; next } on && /^## \[/ { exit } on' \
              docs/CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "::error::docs/CHANGELOG.md has no entry for $version"
            exit 1
          fi
          cat notes.md

      # The repository ships include/ as a directory; the release adds it joined into one file.
      - name: Stage the single-file header and its checksum
        run: |
          cmake -DOUTPUT=dist/minipsd.h -P tools/amalgamate.cmake
          cd dist && sha256sum minipsd.h > minipsd.h.sha256 && cat minipsd.h.sha256

      # The plugin's sources, the single-file header, how libvips is found and an example, one zip.
      - name: Stage the libvips plugin and its checksum
        run: |
          cmake -DOUTPUT_DIR=dist -P tools/package_vips.cmake
          cd dist && for zip in minipsd-vips-*.zip; do sha256sum "$zip" > "$zip.sha256" && cat "$zip.sha256"; done

      # Built from the zip alone, outside the repository, against the system's libvips; its example
      # saves a PSD through the plugin and reads it back. Its SBOM fragment checked against its files.
      - name: Check the plugin builds and runs as released
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends libvips-dev ninja-build
          mkdir "$RUNNER_TEMP/plugin" && cd "$RUNNER_TEMP/plugin"
          cmake -E tar xf "$GITHUB_WORKSPACE"/dist/minipsd-vips-*.zip
          cmake -DSPDX="$(echo minipsd-vips-*)/minipsd-vips.spdx.json" -DBASE="$(echo minipsd-vips-*)" -DCOMPLETE=ON                 -P "$GITHUB_WORKSPACE"/tools/check_spdx.cmake
          cmake -S minipsd-vips-* -B build -G Ninja
          cmake --build build
          ctest --test-dir build --output-on-failure

      # Verifiable with: gh attestation verify minipsd.h --repo ShadobaDev/minipsd (the zip alike)
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            dist/minipsd.h
            dist/minipsd-vips-*.zip

      - name: Publish the GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          body_path: notes.md
          fail_on_unmatched_files: true
          files: |
            dist/minipsd.h
            dist/minipsd.h.sha256
            dist/minipsd-vips-*.zip
            dist/minipsd-vips-*.zip.sha256
