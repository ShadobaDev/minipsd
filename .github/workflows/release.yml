# Release: a pushed tag X.Y.Z (bare semver) checks that CI already passed on its commit on master,
# checks the tag against the header version and the changelog, and publishes minipsd.h (include/ joined into one file by
# tools/amalgamate.cmake) + minipsd.h.sha256 as a GitHub Release with a build-provenance attestation. "Run workflow" (workflow_dispatch) does everything except publish,
# so it is a dry run. See docs/GITHUB-RELEASE.md.
name: Release

on:
  push:
    tags: [ '*.*.*' ]
  workflow_dispatch:

permissions:
  contents: write        # create the Release
  actions: read          # find CI's runs on the commit
  id-token: write        # sign the attestation
  attestations: write    # store it

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # master's history, to find the commit in it

      # CI runs on every push to master, so the commit is tested already: the release checks
      # that rather than testing it again.
      - name: Check the commit is on master and CI passed on it
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/master; then
            echo "::error::$GITHUB_SHA is not on master: a release is made from what master has"
            exit 1
          fi
          passed=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$GITHUB_SHA" \
                   --status success --json databaseId --jq length)
          if [ "$passed" -eq 0 ]; then
            echo "::error::no successful CI run on $GITHUB_SHA: wait for CI to finish, then re-run this job"
            exit 1
          fi

      - name: Check the tag, the header version and the changelog agree
        run: |
          version=$(sed -nE 's/^#define MINIPSD_VERSION_(MAJOR|MINOR|PATCH) +([0-9]+)$/\2/p' include/minipsd.h | paste -sd.)
          echo "header version: $version"
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match the header version $version"
            exit 1
          fi
          # The release notes: the changelog section of this version, without its heading.
          awk -v head="## [$version]" 'index($0, head) == 1 { on = 1; next } on && /^## \[/ { exit } on' \
              docs/CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "::error::docs/CHANGELOG.md has no entry for $version"
            exit 1
          fi
          cat notes.md

      # The repository ships include/ as a directory; the release adds it joined into one file.
      - name: Stage the single-file header and its checksum
        run: |
          cmake -DOUTPUT=dist/minipsd.h -P tools/amalgamate.cmake
          cd dist && sha256sum minipsd.h > minipsd.h.sha256 && cat minipsd.h.sha256

      # Verifiable with: gh attestation verify minipsd.h --repo ShadobaDev/minipsd
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/minipsd.h

      - name: Publish the GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          body_path: notes.md
          fail_on_unmatched_files: true
          files: |
            dist/minipsd.h
            dist/minipsd.h.sha256
