# Builds and tests minipsd on every supported toolchain: the unit tests (C99 + C++20), the C++17
# compile check, the psd-tools round trip (required here, optional locally) and the consumer tests.
# Then, on Linux, the same tests under sanitizers, clang-tidy and coverage (job "analysis").
# release.yml publishes only a commit this workflow has passed on master.
# Branches run nothing until a pull request is ready for review (drafts are skipped); after that,
# each push to it runs again and cancels the run it replaces.
name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    types: [ opened, synchronize, reopened, ready_for_review ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    if: ${{ !github.event.pull_request.draft }}
    name: ${{ matrix.preset }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # windows-2022, not windows-latest: the msvc preset's generator is "Visual Studio 17 2022".
          # msvc also builds and runs examples/vips_composite.c and the libvips plugin
          # (libvips-plugin/) on libvips' prebuilt Windows build (fetched, pinned; MSVC is what
          # Platemaker builds with).
          - { os: windows-2022,   preset: msvc, vips: ON }
          - { os: windows-latest, preset: mingw }
          # linux-gcc also reads psd-tools' 315 files (22 MB, pinned by hash): every comparison
          # with psd-tools, Photoshop's ZIP files through zlib among them.
          - { os: ubuntu-latest,  preset: linux-gcc, psd_tools_files: ON }
          - { os: ubuntu-latest,  preset: linux-clang }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      # The independent reader for the round trip, in the Python that CMake is pointed at below.
      - id: python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install -r tests/requirements.txt

      # Windows / MinGW: gcc, cmake, ninja and pkg-config from MSYS2's UCRT64 (MINGW64 is deprecated
      # there; local builds on MINGW64 still cover the old msvcrt runtime). path-type inherit keeps
      # the Python above reachable from the msys2 shell.
      - if: matrix.preset == 'mingw'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          path-type: inherit
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-pkgconf

      # Linux: gcc and clang are preinstalled.
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build pkg-config

      - name: Configure, build, test (MinGW)
        if: matrix.preset == 'mingw'
        shell: msys2 {0}
        run: |
          cmake --preset mingw -DMINIPSD_REQUIRE_PSD_TOOLS=ON "-DPython3_EXECUTABLE=${{ steps.python.outputs.python-path }}"
          cmake --build --preset mingw
          ctest --preset mingw

      - name: Configure, build, test
        if: matrix.preset != 'mingw'
        run: |
          cmake --preset ${{ matrix.preset }} -DMINIPSD_REQUIRE_PSD_TOOLS=ON -DMINIPSD_PSD_TOOLS_FILES=${{ matrix.psd_tools_files || 'OFF' }} -DMINIPSD_VIPS_EXAMPLE=${{ matrix.vips || 'OFF' }} -DMINIPSD_VIPS_PLUGIN=${{ matrix.vips || 'OFF' }} "-DPython3_EXECUTABLE=${{ steps.python.outputs.python-path }}"
          cmake --build --preset ${{ matrix.preset }}
          ctest --preset ${{ matrix.preset }}

      # The Debian package the release publishes: packed, installed, found by a consumer.
      - name: Check the Debian package
        if: matrix.preset == 'linux-gcc'
        run: sh tools/check_deb.sh

      # The plugin as released (minipsd-vips-X.Y.Z.zip, tools/package_vips.cmake): built from the
      # zip alone, outside the repository, its example run, its SBOM fragment checked against its
      # files; libvips as fetched above. The release builds it again on Linux before publishing.
      - name: Check the released plugin builds and runs
        if: matrix.vips == 'ON'
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          cmake -DOUTPUT_DIR="$env:RUNNER_TEMP/dist" -P tools/package_vips.cmake
          $zip  = Get-Item "$env:RUNNER_TEMP/dist/minipsd-vips-*.zip"
          cmake -E chdir "$env:RUNNER_TEMP" cmake -E tar xf $zip.FullName
          $unpacked = Join-Path $env:RUNNER_TEMP $zip.BaseName
          cmake "-DSPDX=$unpacked/minipsd-vips.spdx.json" "-DBASE=$unpacked" -DCOMPLETE=ON -P tools/check_spdx.cmake
          $deps = "$env:GITHUB_WORKSPACE/build/${{ matrix.preset }}/_deps"
          cmake -S (Join-Path $env:RUNNER_TEMP $zip.BaseName) -B "$env:RUNNER_TEMP/plugin" `
                "-DFETCHCONTENT_SOURCE_DIR_MINIPSD_LIBVIPS=$deps/minipsd_libvips-src" `
                "-DFETCHCONTENT_SOURCE_DIR_MINIPSD_ZLIB_HEADERS=$deps/minipsd_zlib_headers-src"
          cmake --build "$env:RUNNER_TEMP/plugin"
          ctest --test-dir "$env:RUNNER_TEMP/plugin" -C Debug --output-on-failure

  # The same tests, instrumented, on Linux:
  #   linux-asan      AddressSanitizer + UBSan: out-of-bounds access, overflow, undefined shifts.
  #                   No round trip: Python would need the sanitizer runtime preloaded.
  #   linux-tsan      ThreadSanitizer: decode calls run at once on one reader.
  #   linux-tidy      clang-tidy with .clang-tidy, findings are errors.
  #   linux-coverage  coverage of minipsd.h, round trip included: lines 100 %, branches >= 95 %.
  analysis:
    if: ${{ !github.event.pull_request.draft }}
    name: ${{ matrix.preset }}
    strategy:
      fail-fast: false
      matrix:
        preset: [ linux-asan, linux-tsan, linux-tidy, linux-coverage ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y ninja-build pkg-config

      - if: matrix.preset != 'linux-asan' && matrix.preset != 'linux-tsan'
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - if: matrix.preset == 'linux-tidy'
        run: python -m pip install -r tests/requirements-qa.txt
      - if: matrix.preset == 'linux-coverage'
        run: python -m pip install -r tests/requirements-qa.txt -r tests/requirements.txt
      # ThreadSanitizer cannot map its shadow memory under the runner's wider ASLR.
      - if: matrix.preset == 'linux-tsan'
        run: sudo sysctl vm.mmap_rnd_bits=28

      - name: Configure, build, test
        run: |
          cmake --preset ${{ matrix.preset }} -DMINIPSD_REQUIRE_PSD_TOOLS=${{ matrix.preset == 'linux-coverage' && 'ON' || 'OFF' }}
          cmake --build --preset ${{ matrix.preset }}
          ctest --preset ${{ matrix.preset }}

      # --merge-lines: minipsd.h is compiled into several test files; count each line once.
      # --exclude-throw-branches: the C++ builds add exception edges that C code never takes.
      # The C units (the C smoke test, the examples, the fuzz replay) check that the header builds
      # and behaves as C, not coverage: gcc numbers a line's branches differently in C, so gcovr
      # cannot merge them with the C++ units' and lists them twice. Their data goes first.
      - name: Coverage report
        if: matrix.preset == 'linux-coverage'
        run: |
          find build/linux-coverage \( -name '*.c.gcda' -o -name '*.c.gcno' \) -delete
          gcovr --root . --filter include/ --merge-lines --exclude-throw-branches \
                --fail-under-line 100 --fail-under-branch 95 \
                --cobertura coverage.xml --txt coverage.txt --txt-metric branch --txt-summary \
                build/linux-coverage || status=$?
          { echo '```'; cat coverage.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit ${status:-0}

      - name: Upload to Coveralls
        if: matrix.preset == 'linux-coverage'
        uses: coverallsapp/github-action@v2
        with:
          file: coverage.xml
          fail-on-error: false   # a Coveralls outage must not turn CI red
